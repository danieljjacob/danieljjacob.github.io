<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toby's Milkbar — Sambos that hit the spot.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* === PRINT-SPECIFIC === */
  @page { size: A4 portrait; margin: 12mm; }

  html, body {
    background: #F4EAD5 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Disable animations/transforms that mess with print */
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }

  /* Hide interactive chrome */
  .nav, .fab-cart, .modal-overlay, .toast,
  [data-tweaks-panel], [data-tweaks-toggle],
  .tweaks-panel, .tweaks-toggle {
    display: none !important;
  }

  /* Page breaks between sections */
  section {
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .hero, .story, .menu, .find, .catering, .social, .footer {
    break-before: page;
    page-break-before: always;
  }
  .hero { break-before: auto; page-break-before: auto; }

  /* Keep menu cards from being split */
  .menu-card, .find-info-block, .story-img, .find-map, .social-tile, .catering-form {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Tame heights so sections fit pages reasonably */
  .hero { min-height: auto; padding: 24px 0; }
  .find-map { min-height: 360px; }

  /* Clamp headline size for paper */
  .hero-headline { font-size: clamp(56px, 9vw, 120px); }
  .section-title { font-size: clamp(40px, 6vw, 88px); }
  .footer-huge { font-size: clamp(64px, 14vw, 180px); }
  .marquee { display: none; }

  /* Remove scrollbars/overflow clipping for full content */
  html, body { overflow: visible !important; }

  /* Stickier separators */
  section { border-bottom: 2px solid #0E0E0C; }

  /* Hide grain overlay (heavy + ugly in print) */
  .grain { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel">
  // Auto-print after fonts + babel + react have settled
  (async () => {
    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
    } catch (e) {}
    // Wait until app rendered something
    const waitForApp = () => new Promise(res => {
      const check = () => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) return res();
        setTimeout(check, 100);
      };
      check();
    });
    await waitForApp();
    setTimeout(() => window.print(), 800);
  })();
</script>
</body>
</html>
