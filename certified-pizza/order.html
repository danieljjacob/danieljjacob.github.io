<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Online — Certified Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&family=Oswald:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .od-hero {
    background: var(--ink); color: var(--bg);
    padding: 60px 40px 40px;
  }
  .od-hero-inner { max-width: 1440px; margin: 0 auto; display: flex; justify-content: space-between; align-items: end; gap: 40px; flex-wrap: wrap; }
  .od-hero h1 {
    font-size: clamp(56px, 10vw, 144px);
    color: var(--bg); line-height: 0.85;
  }
  .od-hero h1 em { color: var(--red); font-style: normal; }
  .od-hero .crumb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    opacity: 0.5; margin-bottom: 18px;
  }

  .mode-toggle {
    display: flex;
    gap: 0;
    border: 1px solid rgba(245,241,234,.3);
  }
  .mode-toggle button {
    padding: 14px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    background: transparent; color: var(--bg);
    border: none; cursor: pointer;
    border-right: 1px solid rgba(245,241,234,.3);
  }
  .mode-toggle button:last-child { border-right: none; }
  .mode-toggle button.active { background: var(--bg); color: var(--ink); }

  .od-grid {
    max-width: 1440px; margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 0;
    min-height: 70vh;
    border-bottom: 1px solid var(--ink);
  }
  .od-menu {
    padding: 40px;
    border-right: 1px solid var(--ink);
  }
  .od-cart {
    padding: 40px;
    background: var(--bg-alt);
    position: sticky; top: 64px;
    align-self: start;
    height: fit-content;
  }

  .od-search {
    display: flex; gap: 12px; align-items: center;
    border: 1px solid var(--ink);
    padding: 4px;
    margin-bottom: 24px;
  }
  .od-search input {
    flex: 1; border: none; outline: none; padding: 12px 16px;
    background: transparent; font-family: inherit; font-size: 15px;
  }
  .od-pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
  .od-pill {
    padding: 8px 14px;
    border: 1px solid var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    background: transparent; cursor: pointer;
  }
  .od-pill.active { background: var(--ink); color: var(--bg); }

  .od-cat {
    font-family: 'Anton', sans-serif;
    font-size: 32px; text-transform: uppercase;
    line-height: 1; letter-spacing: 0.005em;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 12px;
    margin: 32px 0 16px;
    display: flex; justify-content: space-between; align-items: end;
  }
  .od-cat .ct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; color: var(--muted);
  }

  .od-item {
    display: grid;
    grid-template-columns: 80px 1fr auto;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid var(--rule);
    align-items: center;
  }
  .od-item .ph { aspect-ratio: 1; }
  .od-item .name {
    font-family: 'Anton', sans-serif;
    font-size: 22px; text-transform: uppercase;
    line-height: 1.05;
  }
  .od-item .desc {
    font-size: 13px; color: var(--ink-soft);
    margin-top: 4px; line-height: 1.5;
  }
  .od-item .sizes {
    display: flex; gap: 4px; margin-top: 10px;
  }
  .od-size {
    padding: 6px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em;
    border: 1px solid var(--ink);
    cursor: pointer;
    background: transparent;
    min-width: 70px;
    text-align: left;
    transition: all 0.15s;
  }
  .od-size:hover { background: var(--ink); color: var(--bg); }
  .od-size .s { display: block; font-size: 9px; color: var(--muted); margin-bottom: 2px; }
  .od-size:hover .s { color: rgba(245,241,234,.6); }
  .od-size .p { font-family: 'Anton', sans-serif; font-size: 16px; letter-spacing: 0; }
  .od-size.thirty { border-color: var(--red); }
  .od-size.thirty .p { color: var(--red); }
  .od-size.thirty:hover { background: var(--red); color: #fff; border-color: var(--red); }

  /* Cart */
  .cart-h {
    font-size: 32px; line-height: 1;
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  .cart-h .num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
  .cart-empty {
    padding: 40px 0;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .cart-empty .big {
    font-family: 'Anton', sans-serif;
    font-size: 56px; color: var(--ink);
    line-height: 1; margin-bottom: 14px;
    opacity: 0.15;
  }
  .ci {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
  }
  .ci .name { font-family: 'Anton', sans-serif; font-size: 18px; text-transform: uppercase; line-height: 1.1; }
  .ci .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: var(--muted); margin-top: 4px; }
  .ci .price { font-family: 'Anton', sans-serif; font-size: 20px; }
  .ci .qty { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .ci .qty button {
    width: 22px; height: 22px;
    border: 1px solid var(--ink);
    font-family: 'JetBrains Mono', monospace;
    background: transparent; cursor: pointer;
  }
  .ci .qty button:hover { background: var(--ink); color: var(--bg); }
  .ci .qty .n { font-family: 'JetBrains Mono', monospace; font-size: 12px; min-width: 16px; text-align: center; }
  .ci .rm {
    color: var(--red); font-family: 'JetBrains Mono', monospace; font-size: 10px;
    background: none; border: none; padding: 4px 0; cursor: pointer; text-transform: uppercase;
    letter-spacing: 0.14em; margin-top: 4px;
  }

  .totals {
    margin-top: 18px;
    border-top: 1px solid var(--ink);
    padding-top: 18px;
  }
  .totals-row {
    display: flex; justify-content: space-between;
    padding: 6px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted);
  }
  .totals-row.grand {
    font-family: 'Anton', sans-serif;
    font-size: 32px;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.005em;
    border-top: 1px solid var(--ink);
    margin-top: 10px; padding-top: 14px;
  }
  .checkout {
    width: 100%; margin-top: 18px; justify-content: center;
    background: var(--red); border-color: var(--red); color: #fff;
    padding: 18px;
    font-size: 12px;
  }
  .checkout:disabled { background: var(--rule); border-color: var(--rule); color: var(--muted); cursor: not-allowed; }

  .delivery-info {
    margin-top: 14px;
    padding: 14px;
    background: var(--bg);
    border: 1px solid var(--rule);
    font-size: 12px;
    line-height: 1.5;
  }
  .delivery-info .row {
    display: flex; justify-content: space-between;
    margin-bottom: 6px;
  }
  .delivery-info .row:last-child { margin-bottom: 0; }
  .delivery-info .k { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }

  @media (max-width: 1024px) {
    .od-grid { grid-template-columns: 1fr; }
    .od-menu { border-right: none; border-bottom: 1px solid var(--ink); }
    .od-cart { position: static; }
    .nav-links { display: none; }
  }
</style>
<script>window.__page='order';</script>
</head>
<body>
<div id="nav-slot"></div>

<header class="od-hero">
  <div class="od-hero-inner">
    <div>
      <div class="crumb">Order online · Tue–Sun · 5pm – late</div>
      <h1 class="display">Order <em>now.</em></h1>
    </div>
    <div class="mode-toggle">
      <button class="active" data-mode="delivery">Delivery</button>
      <button data-mode="pickup">Pickup</button>
      <button data-mode="dinein">Dine in</button>
    </div>
  </div>
</header>

<section class="od-grid">
  <div class="od-menu">
    <div class="od-search">
      <span class="mono" style="padding-left:10px;color:var(--muted)">Search →</span>
      <input id="search" placeholder="Margherita, meat lover, garlic bread..." />
    </div>
    <div class="od-pill-row">
      <button class="od-pill active" data-cat="all">All</button>
      <button class="od-pill" data-cat="pizza">Pizzas</button>
      <button class="od-pill" data-cat="thirty">★ 30-inch</button>
      <button class="od-pill" data-cat="starter">Starters</button>
      <button class="od-pill" data-cat="pasta">Pasta</button>
      <button class="od-pill" data-cat="drink">Drinks</button>
    </div>

    <div id="od-list"></div>
  </div>

  <aside class="od-cart">
    <div class="cart-h">
      <span class="display">Your order</span>
      <span class="num" id="cart-count">0 items</span>
    </div>
    <div id="cart-body"></div>

    <div class="totals" id="totals" style="display:none">
      <div class="totals-row"><span>Subtotal</span><span id="t-sub">$0.00</span></div>
      <div class="totals-row"><span id="t-fee-l">Delivery fee</span><span id="t-fee">$5.00</span></div>
      <div class="totals-row"><span>GST included</span><span id="t-gst">$0.00</span></div>
      <div class="totals-row grand"><span>Total</span><span id="t-grand">$0.00</span></div>
      <button class="btn checkout" id="checkout">Checkout →</button>
    </div>

    <div class="delivery-info">
      <div class="row"><span class="k">Mode</span><span id="i-mode">Delivery</span></div>
      <div class="row"><span class="k">Address</span><span id="i-addr">Not set →</span></div>
      <div class="row"><span class="k">ETA</span><span id="i-eta">35–50 min</span></div>
      <div class="row"><span class="k">Min order</span><span>$25</span></div>
    </div>
  </aside>
</section>

<div id="footer-slot"></div>
<script src="partials.js"></script>
<script>
const ITEMS = [
  // Pizzas — 12/16/30
  { id:'p1', cat:'pizza', name:'The Queen Street', desc:'Margherita: San Marzano, fior di latte, basil.', sizes:[['12″',19],['16″',25],['30″',89]] },
  { id:'p2', cat:'pizza', name:'The Great Western', desc:'Pepperoni, soppressata, sausage, pancetta.', sizes:[['12″',26],['16″',32],['30″',108]] },
  { id:'p3', cat:'pizza', name:'The Charles Hackett', desc:'All meat: pepperoni, sausage, bacon, prosciutto.', sizes:[['12″',29],['16″',35],['30″',118]] },
  { id:'p4', cat:'pizza', name:'The Phillip Street', desc:'Quattro formaggi: mozz, gorgonzola, taleggio, parm.', sizes:[['12″',24],['16″',30],['30″',99]] },
  { id:'p5', cat:'pizza', name:'The Henry Lawson', desc:'Prosciutto, rocket, parmigiano, lemon, EVOO.', sizes:[['12″',25],['16″',31],['30″',104]] },
  { id:'p6', cat:'pizza', name:'The Crana Street', desc:'\u2018Nduja, hot honey, fior di latte, chilli oil.', sizes:[['12″',24],['16″',30],['30″',99]] },
  { id:'p7', cat:'pizza', name:'The Pendle Hill', desc:'Anchovies, capers, olives, oregano, garlic.', sizes:[['12″',23],['16″',29],['30″',96]] },
  { id:'p8', cat:'pizza', name:'The Werrington', desc:'Pumpkin, goat cheese, sage, walnuts, balsamic.', sizes:[['12″',24],['16″',30],['30″',99]] },

  // 30-inch combos
  { id:'t1', cat:'thirty', name:'30″ The Mamre Monster', desc:'Half meat lover, half supreme. Feeds 10+.', sizes:[['30″',108]] },
  { id:'t2', cat:'thirty', name:'30″ Build Your Own', desc:'Your toppings, our 30-inch base.', sizes:[['30″',89]] },

  // Starters
  { id:'s1', cat:'starter', name:'Garlic Bread', desc:'House focaccia, garlic, sea salt.', sizes:[['Reg',10]] },
  { id:'s2', cat:'starter', name:'Garlic & Cheese', desc:'Add fior di latte, parmigiano, oregano.', sizes:[['Reg',13]] },
  { id:'s3', cat:'starter', name:'Arancini (3)', desc:'Saffron risotto, mozzarella, sugo.', sizes:[['Reg',15]] },
  { id:'s4', cat:'starter', name:'Polpette', desc:'Beef &amp; pork meatballs, sugo, parmigiano.', sizes:[['Reg',17]] },
  { id:'s5', cat:'starter', name:'Caprese', desc:'Burrata, heirloom tomato, basil, EVOO.', sizes:[['Reg',19]] },

  // Pasta
  { id:'pa1', cat:'pasta', name:'Spaghetti Bolognese', desc:'Slow-cooked beef &amp; pork ragù.', sizes:[['Reg',22]] },
  { id:'pa2', cat:'pasta', name:'Penne Arrabbiata', desc:'Garlic, chilli, San Marzano, basil.', sizes:[['Reg',20]] },
  { id:'pa3', cat:'pasta', name:'Fettuccine Carbonara', desc:'Guanciale, egg yolk, pecorino, pepper.', sizes:[['Reg',23]] },

  // Drinks
  { id:'d1', cat:'drink', name:'Coke', desc:'Glass bottle, 330ml.', sizes:[['Btl',5]] },
  { id:'d2', cat:'drink', name:'San Pellegrino', desc:'Sparkling, 500ml.', sizes:[['Btl',6]] },
  { id:'d3', cat:'drink', name:'Aranciata Rossa', desc:'Blood orange, San Pellegrino.', sizes:[['Btl',6]] },
  { id:'d4', cat:'drink', name:'Limonata', desc:'San Pellegrino lemon.', sizes:[['Btl',6]] },
];

let state = { cart: [], cat: 'all', search: '', mode: 'delivery' };

function renderList() {
  const list = document.getElementById('od-list');
  const groups = {};
  const filtered = ITEMS.filter(i => {
    if (state.cat !== 'all' && i.cat !== state.cat) return false;
    if (state.search && !i.name.toLowerCase().includes(state.search.toLowerCase()) && !i.desc.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });
  filtered.forEach(i => { (groups[i.cat] = groups[i.cat] || []).push(i); });

  const labels = { pizza:'Hand-stretched Pizzas', thirty:'★ The 30-inch', starter:'Starters', pasta:'Pasta', drink:'Drinks' };
  const order = ['pizza','thirty','starter','pasta','drink'];

  list.innerHTML = order.filter(k => groups[k]).map(k => `
    <div class="od-cat display">
      <span>${labels[k]}</span>
      <span class="ct">${groups[k].length} item${groups[k].length>1?'s':''}</span>
    </div>
    ${groups[k].map(item => `
      <div class="od-item">
        <div class="ph"><span>${item.name.replace('The ','').toUpperCase().slice(0,14)}</span></div>
        <div>
          <div class="name">${item.name}</div>
          <div class="desc">${item.desc}</div>
          <div class="sizes">
            ${item.sizes.map(([s,p],idx) => `
              <button class="od-size ${s.includes('30')?'thirty':''}" data-id="${item.id}" data-size="${s}" data-price="${p}">
                <span class="s">${s}</span>
                <span class="p">$${p}</span>
              </button>`).join('')}
          </div>
        </div>
        <div></div>
      </div>`).join('')}
  `).join('') || '<div style="padding:40px 0;color:var(--muted);font-family:\'JetBrains Mono\',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase">No items match.</div>';

  list.querySelectorAll('.od-size').forEach(b => {
    b.onclick = () => addToCart(b.dataset.id, b.dataset.size, +b.dataset.price);
  });
}

function addToCart(id, size, price) {
  const key = id + '|' + size;
  const ex = state.cart.find(c => c.key === key);
  if (ex) ex.qty++;
  else {
    const item = ITEMS.find(i => i.id === id);
    state.cart.push({ key, id, size, price, qty: 1, name: item.name });
  }
  renderCart();
}

function renderCart() {
  const body = document.getElementById('cart-body');
  const totals = document.getElementById('totals');
  document.getElementById('cart-count').textContent = `${state.cart.reduce((a,c)=>a+c.qty,0)} item${state.cart.reduce((a,c)=>a+c.qty,0)===1?'':'s'}`;

  if (state.cart.length === 0) {
    body.innerHTML = `
      <div class="cart-empty">
        <div class="big">EMPTY</div>
        Pick something from the menu — we'll start the dough.
      </div>`;
    totals.style.display = 'none';
    return;
  }

  body.innerHTML = state.cart.map(c => `
    <div class="ci">
      <div>
        <div class="name">${c.name}</div>
        <div class="meta">${c.size} · $${c.price}</div>
        <div class="qty">
          <button data-act="dec" data-key="${c.key}">−</button>
          <span class="n">${c.qty}</span>
          <button data-act="inc" data-key="${c.key}">+</button>
        </div>
      </div>
      <div style="text-align:right">
        <div class="price">$${(c.qty * c.price).toFixed(0)}</div>
        <button class="rm" data-act="rm" data-key="${c.key}">Remove</button>
      </div>
    </div>
  `).join('');

  body.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.key; const a = b.dataset.act;
      const i = state.cart.findIndex(c => c.key === k);
      if (i < 0) return;
      if (a === 'inc') state.cart[i].qty++;
      else if (a === 'dec') { state.cart[i].qty--; if (state.cart[i].qty <= 0) state.cart.splice(i, 1); }
      else if (a === 'rm') state.cart.splice(i, 1);
      renderCart();
    };
  });

  const sub = state.cart.reduce((a, c) => a + c.qty * c.price, 0);
  const fee = state.mode === 'delivery' ? 5 : 0;
  const total = sub + fee;
  const gst = total / 11;
  document.getElementById('t-sub').textContent = '$' + sub.toFixed(2);
  document.getElementById('t-fee').textContent = '$' + fee.toFixed(2);
  document.getElementById('t-gst').textContent = '$' + gst.toFixed(2);
  document.getElementById('t-grand').textContent = '$' + total.toFixed(2);
  document.getElementById('t-fee-l').textContent = state.mode === 'delivery' ? 'Delivery fee' : (state.mode === 'pickup' ? 'Pickup fee' : 'Service fee');
  document.getElementById('checkout').disabled = sub < 25;
  document.getElementById('checkout').textContent = sub < 25 ? `$${(25-sub).toFixed(0)} below minimum` : 'Checkout →';
  totals.style.display = 'block';
}

document.querySelectorAll('.od-pill').forEach(p => {
  p.onclick = () => {
    document.querySelectorAll('.od-pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    state.cat = p.dataset.cat;
    renderList();
  };
});
document.getElementById('search').oninput = (e) => {
  state.search = e.target.value;
  renderList();
};
document.querySelectorAll('.mode-toggle button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.mode-toggle button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.mode = b.dataset.mode;
    const labels = { delivery:'Delivery', pickup:'Pickup', dinein:'Dine in' };
    const etas = { delivery:'35–50 min', pickup:'20–30 min', dinein:'When you arrive' };
    const addrs = { delivery:'Not set →', pickup:'5 Crana St, St Marys', dinein:'5 Crana St, St Marys' };
    document.getElementById('i-mode').textContent = labels[state.mode];
    document.getElementById('i-eta').textContent = etas[state.mode];
    document.getElementById('i-addr').textContent = addrs[state.mode];
    renderCart();
  };
});

document.getElementById('checkout').onclick = () => {
  alert('Demo: in production this hands off to Stripe / Square. Cart total locked in.');
};

renderList();
renderCart();
</script>
</body>
</html>
